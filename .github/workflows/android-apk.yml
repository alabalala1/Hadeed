name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build APKs by architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Check exercise storage
        run: dart run tools/check_repository.dart

      - name: Check migration and training plans
        run: dart run tools/check_training.dart

      - name: Build release APKs for each architecture
        run: flutter build apk --release --split-per-abi --build-number="$GITHUB_RUN_NUMBER"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hadeed-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload ARM 32-bit APK
        uses: actions/upload-artifact@v4
        with:
          name: Hadeed-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Hadeed-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Show APK sizes and download guide
        shell: bash
        run: |
          {
            echo '### Hadeed APKs'
            echo 'Download an architecture artifact below and extract its APK.'
            echo ''
            echo '| Architecture | APK size |'
            echo '| --- | --- |'
            for abi in arm64-v8a armeabi-v7a x86_64; do
              apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
              size=$(du -h "$apk" | cut -f1)
              echo "| ${abi} | ${size} |"
            done
            echo ''
            echo 'These builds use the existing development signing configuration.'
          } >> "$GITHUB_STEP_SUMMARY"
